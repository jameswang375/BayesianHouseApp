[project]
name = "BayesianWebApp"
version = "0.1.0"
description = "A Bayesian regression app for housing price advice"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "marimo>=0.16.2",
    "duckdb>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=6.3.0",
    "sqlmodel>=0.0.24",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
